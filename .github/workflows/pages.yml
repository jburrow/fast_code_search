name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Own group: sharing one with the benchmark workflow meant every pending
# site deploy was cancelled whenever a benchmark run queued behind it (GitHub
# keeps at most one pending run per group). The deploy pushes without force
# and rebases on conflict, so a benchmark push to dev/bench cannot be lost.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy GitHub Pages site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so we can read tags

      # ── Extract project version from Cargo.toml ────────────────────────
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # ── Prepare the site directory ─────────────────────────────────────
      - name: Prepare site
        run: |
          cp -r docs/site site-output

      # ── Documentation book (mdBook) at /docs/ ──────────────────────────
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin mdbook
          mdbook --version
      - name: Build the binaries the reference pages are generated from
        run: cargo build --release --bin fcs --bin fast_code_search_server
      - name: Build the book
        run: |
          scripts/docs/build-book.sh
          rm -rf site-output/docs && cp -r docs/book/book site-output/docs

      # ── Inject version.json ────────────────────────────────────────────
      - name: Write version.json
        run: |
          cat > site-output/version.json <<EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "built_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit": "${{ github.sha }}"
          }
          EOF

      # ── Extract recent changelog entries and inject as JSON ────────────
      - name: Extract changelog
        run: |
          python3 - <<'PYEOF'
          import re, json, pathlib

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # Find all release sections (skip [Unreleased])
          pattern = re.compile(
              r'## \[(\d+\.\d+\.\d+)\]\s*-\s*(\d{4}-\d{2}-\d{2})(.*?)(?=\n## \[|\Z)',
              re.DOTALL
          )

          releases = []
          for m in pattern.finditer(text):
              version, date, body = m.group(1), m.group(2), m.group(3).strip()
              # Grab first paragraph of body as summary (up to 300 chars)
              lines = [l.strip() for l in body.splitlines() if l.strip()]
              summary_lines = []
              for l in lines:
                  if l.startswith('#'):
                      break
                  summary_lines.append(l.lstrip('-* '))
                  if len(' '.join(summary_lines)) > 300:
                      break
              summary = ' '.join(summary_lines)
              if len(summary) > 300:
                  summary = summary[:297] + '...'
              releases.append({
                  "version": version,
                  "date": date,
                  "summary": summary,
                  "url": f"https://github.com/jburrow/fast_code_search/releases/tag/v{version}"
              })
              if len(releases) >= 8:
                  break

          pathlib.Path("site-output/changelog.json").write_text(
              json.dumps({"releases": releases}, indent=2), encoding="utf-8"
          )
          print(f"Wrote {len(releases)} releases to changelog.json")
          PYEOF

      # ── Deploy to gh-pages ─────────────────────────────────────────────
      # clean-exclude preserves dev/bench/ (benchmark trend data) on every deploy
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site-output
          target-folder: /            # deploy to root of gh-pages
          clean: true
          clean-exclude: |
            dev/**
          force: false                # rebase and retry instead of overwriting a benchmark push
          attempt-limit: 5
          commit-message: "docs: deploy gh-pages site for ${{ steps.version.outputs.VERSION }} @ ${{ github.sha }}"

      # The benchmark trend page. dev/ is excluded from the deploy above so
      # that the benchmark workflow's data.js and results/ survive; this
      # step drops our own index.html (which explains every chart) next to
      # them without cleaning anything. The benchmark action only writes an
      # index.html when none exists, so ours is kept.
      - name: Deploy the benchmark trend page (dev/bench/index.html)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/bench-trends
          target-folder: dev/bench
          clean: false
          force: false
          attempt-limit: 5
          commit-message: "docs: benchmark trend page @ ${{ github.sha }}"
