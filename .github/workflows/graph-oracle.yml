name: graph oracle

# Does the dependency graph draw the edges the languages' own resolvers
# draw? examples/graph_oracle.rs (the comparison `fcs check` runs) compares
# fcs's import graph with grimp on Django, generated deep trees and
# generated monorepo layouts, and with TypeScript's resolveModuleName on
# Vite and a generated workspace monorepo. Every edge fcs misses or draws
# wrongly must be a known gap listed in benches/graph/known_gaps.toml (each
# tied to a row of the book's graph-support page), with its exact count: a
# new miss fails, and so does a fix until its gap is lowered or removed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "examples/graph_oracle.rs"
      - "scripts/graph-oracle/**"
      - "benches/graph/**"
      - "tests/python_codebase.rs"
      - "tests/support/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/graph-oracle.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older runs; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle:
    name: fcs graph vs grimp and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Django (corpus)
        uses: actions/checkout@v4
        with:
          repository: django/django
          ref: "5.2"
          path: bench-corpus/django
          fetch-depth: 1
      - name: Check out Vite (corpus)
        uses: actions/checkout@v4
        with:
          repository: vitejs/vite
          ref: v6.3.5
          path: bench-corpus/vite
          fetch-depth: 1

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the oracles
        run: |
          python -m pip install grimp==3.17
          (cd scripts/graph-oracle && npm ci)

      - name: Build
        run: cargo build --release --example graph_oracle

      - name: Python (grimp on Django)
        run: |
          python src/check/oracle/py.py bench-corpus/django > py.json
          ./target/release/examples/graph_oracle bench-corpus/django --oracle py.json --lang py \
            --gaps benches/graph/known_gaps.toml --corpus django --markdown graph-py.md

      - name: Python (grimp on a package nested 14 levels deep)
        run: |
          python scripts/graph-oracle/deep_python_tree.py deep-py 14
          python src/check/oracle/py.py deep-py > py-deep.json
          ./target/release/examples/graph_oracle deep-py --oracle py-deep.json --lang py \
            --gaps benches/graph/known_gaps.toml --corpus deep-py --markdown graph-py-deep.md

      - name: Python (grimp on a repository whose root folder has __init__.py)
        run: |
          python scripts/graph-oracle/deep_python_tree.py root-init-py 4 --root-init
          python src/check/oracle/py.py root-init-py > py-root-init.json
          ./target/release/examples/graph_oracle root-init-py --oracle py-root-init.json --lang py \
            --gaps benches/graph/known_gaps.toml --corpus root-init-py --markdown graph-py-root-init.md

      # Repositories laid out like real monorepos, generated with seed 1
      # (scripts/graph-oracle/layouts.py): projects side by side each with
      # its own src/, a root folder that is a package, and a namespace
      # package split over two folders. oracle.env tells grimp what is on
      # sys.path.
      - name: Python (generated monorepo layouts)
        run: |
          for layout in monorepo root-init namespace; do
            python scripts/graph-oracle/layouts.py "$layout" "py-$layout" --seed 1
            (set -a; . "py-$layout/oracle.env"; set +a
             python src/check/oracle/py.py "py-$layout" > "py-$layout.json")
            ./target/release/examples/graph_oracle "py-$layout" --oracle "py-$layout.json" --lang py \
              --gaps benches/graph/known_gaps.toml --corpus "py-$layout" --markdown "graph-layout-$layout.md"
          done

      # Seeded generated Python trees whose generator knows every edge,
      # definition and reference (tests/support/pygen.rs). grimp and Python
      # check the generator's key first; the test then checks the graph,
      # symbol and reference searches and strict -deps/-rdeps scopes, after
      # a build and after the watcher rewrites the tree.
      - name: Python (generated codebases with an answer key)
        run: |
          # Fixed seeds on pull requests; new ones on main.
          first=1
          if [ "${{ github.event_name }}" != pull_request ]; then first=$(( GITHUB_RUN_ID % 1000000 )); fi
          FCS_PYGEN_SEEDS=$(seq -s, "$first" $(( first + 39 ))) cargo test --release --test python_codebase
        env:
          FCS_REQUIRE_PYTHON_ORACLES: "1"

      - name: TypeScript (resolveModuleName on Vite)
        run: |
          (cd scripts/graph-oracle && node ../../src/check/oracle/ts.mjs ../../bench-corpus/vite) > ts.json
          ./target/release/examples/graph_oracle bench-corpus/vite --oracle ts.json --lang ts \
            --gaps benches/graph/known_gaps.toml --corpus vite --markdown graph-ts.md

      # npm workspaces with tsconfig paths and extends, barrels, .mts/.cts,
      # installed as symlinks (scripts/graph-oracle/ts_layouts.mjs).
      - name: TypeScript (generated workspace monorepo)
        run: |
          node scripts/graph-oracle/ts_layouts.mjs ts-workspaces --seed 1
          (cd scripts/graph-oracle && node ../../src/check/oracle/ts.mjs ../../ts-workspaces) > ts-workspaces.json
          ./target/release/examples/graph_oracle ts-workspaces --oracle ts-workspaces.json --lang ts \
            --gaps benches/graph/known_gaps.toml --corpus ts-workspaces --markdown graph-ts-workspaces.md

      - name: Report
        if: always()
        run: cat graph-py.md graph-py-deep.md graph-py-root-init.md graph-layout-*.md graph-ts.md graph-ts-workspaces.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
