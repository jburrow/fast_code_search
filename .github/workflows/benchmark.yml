name: Benchmarks

on:
  push:
    branches: [main, master]
  schedule:
    # Nightly large-corpus run (see the large-corpus job).
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  benchmark:
    name: Performance Benchmarks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v7

      # Pinned real-world corpora for examples/corpus_bench.rs (about 40 MB
      # of Rust and Python source). Shallow checkouts; bench-corpus/ is
      # gitignored so the results push below is unaffected.
      - name: Check out tokio (corpus)
        uses: actions/checkout@v7
        with:
          repository: tokio-rs/tokio
          ref: tokio-1.45.0
          path: bench-corpus/tokio
          fetch-depth: 1
      - name: Check out django (corpus)
        uses: actions/checkout@v7
        with:
          repository: django/django
          ref: "5.2"
          path: bench-corpus/django
          fetch-depth: 1

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # rust-cache restores target/ but prunes files it does not recognise,
      # which can leave Criterion baseline directories without their
      # sample.json; Criterion then logs errors into the bencher output and
      # the trend action finds nothing to parse. Start from no baselines.
      - name: Reset Criterion state
        run: rm -rf target/criterion

      - name: Run search benchmarks
        run: cargo bench --bench search_benchmark -- --output-format bencher --noplot | tee bench_output.txt

      - name: Run persistence benchmarks
        run: cargo bench --bench persistence_benchmark -- --output-format bencher --noplot | tee -a bench_output.txt

      - name: Run real-corpus benchmark (tokio + django)
        run: |
          cargo run --release --example corpus_bench -- \
            bench-corpus/tokio bench-corpus/django \
            --label tokio+django --iterations 30 --bencher \
            --markdown corpus_summary.md --json corpus_result.json | tee -a bench_output.txt
          cat corpus_summary.md >> "$GITHUB_STEP_SUMMARY"

      # Does the first result answer the query? Precision over labelled
      # queries; a ranking change that hurts this fails the run.
      - name: Ranking quality (precision@1 / @5)
        run: |
          cargo run --release --example ranking_quality -- \
            bench-corpus/tokio bench-corpus/django \
            --markdown ranking_quality.md --json ranking_quality.json \
            --min-p1 0.90 --min-p5 0.95
          cat ranking_quality.md >> "$GITHUB_STEP_SUMMARY"

      # The same queries through ripgrep, ugrep and fcs on the same tree
      # (scripts/bench/compare.sh): warm cache, median of 7 runs, wall time.
      - name: Install ripgrep and ugrep
        run: sudo apt-get install -y ripgrep ugrep
      - name: Compare with scan tools (ripgrep, ugrep)
        run: |
          cargo build --release --bins
          scripts/bench/compare.sh bench-corpus/tokio bench-corpus/django \
            --runs 7 --json compare.json --markdown compare.md
          cat compare.md >> "$GITHUB_STEP_SUMMARY"
          # Also as bencher lines, so the trend page can chart every tool per commit.
          python3 - <<'PY'
          import json, re
          c = json.load(open("compare.json"))
          slug = lambda s: re.sub(r"[^a-z0-9]+", "_", s.lower()).strip("_")
          with open("bench_output.txt", "a") as f:
              for q in c["queries"]:
                  for tool, key in [("ripgrep", "ripgrep_ms"), ("ugrep", "ugrep_ms"),
                                    ("fcs_client", "fcs_client_ms"), ("fcs_engine", "fcs_engine_ms")]:
                      v = q.get(key)
                      if v is not None:
                          f.write(f"test compare/{c['tree']}/{tool}/{slug(q['label'])} ... bench: {int(v * 1e6)} ns/iter (+/- 0)\n")
          PY

      # Machine-readable results for the documentation site
      # (docs/benchmarks/latest.html reads dev/bench/results/latest.json).
      - name: Assemble results for the site
        run: |
          mkdir -p bench-results
          python3 - <<'PY'
          import json, os, datetime
          corpus = json.load(open("corpus_result.json"))
          ranking = json.load(open("ranking_quality.json"))
          compare = json.load(open("compare.json"))
          out = {
            "schema": 1,
            "generated_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "commit": os.environ["GITHUB_SHA"],
            "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "corpus": corpus,
            "ranking_quality": ranking,
            "comparison": compare,
          }
          json.dump(out, open("bench-results/latest.json", "w"), indent=1)
          stamp = out["generated_at"][:10] + "-" + out["commit"][:7]
          json.dump(out, open(f"bench-results/{stamp}.json", "w"), indent=1)
          PY
          ls -la bench-results

      - name: Run validator (functional performance test)
        run: cargo run --release --bin fast_code_search_validator -- --json --corpus-size 200 | tee validator_output.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench_output.txt
            validator_output.json
            corpus_summary.md
            corpus_result.json
            ranking_quality.md
            ranking_quality.json
            compare.md
            compare.json

      - name: Keep only bencher lines for trend tracking
        run: |
          grep -E '^test .+ \.\.\. bench: ' bench_output.txt > bench_results.txt
          wc -l bench_results.txt

      - name: Reset local changes before branch switch
        run: git checkout -- .

      - name: Publish results to the site (dev/bench/results)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bench-results
          target-folder: dev/bench/results
          clean: false
          force: false
          attempt-limit: 5
          commit-message: "bench: results for ${{ github.sha }}"

      - name: Store benchmark results for trend tracking
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fast_code_search Benchmarks
          tool: cargo
          output-file-path: bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '200%'
          fail-on-alert: false

  # Nightly: a large corpus (the Rust compiler tree, hundreds of MB and
  # tens of thousands of files) with file count, throughput and resident
  # memory in the job summary. Not pushed to the trend chart.
  large-corpus:
    name: Large corpus (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out rust-lang/rust 1.89.0 (corpus)
        uses: actions/checkout@v7
        with:
          repository: rust-lang/rust
          ref: "1.89.0"
          path: bench-corpus/rust
          fetch-depth: 1

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run real-corpus benchmark (rust-lang/rust)
        run: |
          cargo run --release --example corpus_bench -- bench-corpus/rust \
            --label rust-1.89.0 --iterations 20 --markdown corpus_summary.md
          cat corpus_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: large-corpus-results
          path: corpus_summary.md
