name: impact oracle

# Does `fcs impact` list the files that use what a diff changes?
# examples/impact_oracle.rs runs the impact analysis on the diffs of
# Django's most recent commits that change Python (pinned, 400 commits of history) and compares the files listed
# for each changed symbol with the files where Jedi resolves a use to it
# (src/check/oracle/py_impact.py). It fails below the recorded baselines;
# raise them when a change improves the numbers. What the numbers mean:
# docs/book/src/reference/impact.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - "src/impact/**"
      - "src/search/engine/impact.rs"
      - "src/symbols/**"
      - "src/dependencies/**"
      - "src/check/oracle/py_impact.py"
      - "examples/impact_oracle.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/impact-oracle.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle:
    name: fcs impact vs Jedi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Django (corpus, with history)
        uses: actions/checkout@v4
        with:
          repository: django/django
          ref: 79502d08405dbf24efa39e8731320f31035b9e9c
          path: bench-corpus/django
          fetch-depth: 400

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the oracle
        run: python -m pip install jedi==0.20.1

      - name: Build
        run: cargo build --release --example impact_oracle

      - name: Jedi's uses on Django
        run: python src/check/oracle/py_impact.py bench-corpus/django django-impact.jsonl

      - name: fcs impact vs Jedi
        run: |
          ./target/release/examples/impact_oracle --repo bench-corpus/django \
            --oracle django-impact.jsonl --commits 300 \
            --min-found 0.98 --min-right 0.75 --min-member-found 0.95 \
            --markdown impact-django.md

      - name: Report
        if: always()
        run: cat impact-django.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
