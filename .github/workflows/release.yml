name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: fast_code_search_server

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl == true
        run: sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release directory
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe release/
            cp target/${{ matrix.target }}/release/fcs.exe release/
          else
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} release/
            cp target/${{ matrix.target }}/release/fcs release/
          fi
          # Startup unit files and their guide ship with every archive.
          cp -r deploy release/
          cp docs/RUN-AT-STARTUP.md docs/CLI.md release/
          # Generate clean config template using the built binary
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./release/${{ env.BINARY_NAME }}.exe --init release/config.toml.example
          else
            ./release/${{ env.BINARY_NAME }} --init release/config.toml.example
          fi
          cp -r proto release/
          cp README.md release/
          cp LICENSE release/

      - name: Create release archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd release
          tar -czvf ../fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz *

      - name: Create release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path release/* -DestinationPath fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.zip

      - name: Generate checksums
        shell: bash
        run: |
          archive=fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            fast_code_search-*.${{ matrix.archive }}
            fast_code_search-*.${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"
          
          if [ -f CHANGELOG.md ]; then
            # Extract content between this version header and next version header
            # Match: ## [0.2.4] - date  until next ## [
            NOTES=$(awk -v ver="$VERSION_NUM" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" ver "]") > 0) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md)
            
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          else
            NOTES="Release ${VERSION}"
          fi
          
          # Write to file for multiline support
          {
            echo "$NOTES"
            echo
            echo "## Install"
            echo
            echo "Download the archive for your platform below, unpack it, and put \`fast_code_search_server\` and \`fcs\` on your \`PATH\`."
            echo "Each archive also contains \`config.toml.example\`, the startup unit files (\`deploy/\`) and the CLI and startup guides."
            echo
            echo "| Platform | Archive |"
            echo "|---|---|"
            echo "| Linux x86_64 (glibc) | \`fast_code_search-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| Linux x86_64 (static, musl) | \`fast_code_search-${VERSION}-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| macOS Apple silicon | \`fast_code_search-${VERSION}-aarch64-apple-darwin.tar.gz\` |"
            echo "| macOS Intel | \`fast_code_search-${VERSION}-x86_64-apple-darwin.tar.gz\` |"
            echo "| Windows x86_64 | \`fast_code_search-${VERSION}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Verify a download with the \`.sha256\` file next to it: \`sha256sum -c fast_code_search-${VERSION}-<target>.tar.gz.sha256\`."
            echo
            echo "First run: \`fast_code_search_server --init config.toml\`, add your paths, start the server, then \`fcs 'fn main'\`."
            echo "Full changelog: https://github.com/jburrow/fast_code_search/blob/main/CHANGELOG.md"
          } > release_notes.md
          
          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
