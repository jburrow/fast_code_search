name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: fast_code_search_server

permissions:
  contents: write
  id-token: write   # keyless signing of the archives with cosign (Sigstore)

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl == true
        run: sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release directory
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe release/
            cp target/${{ matrix.target }}/release/fcs.exe release/
          else
            cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} release/
            cp target/${{ matrix.target }}/release/fcs release/
          fi
          # Startup unit files and their guide ship with every archive.
          cp -r deploy release/
          cp docs/RUN-AT-STARTUP.md docs/CLI.md release/
          # Generate clean config template using the built binary
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./release/${{ env.BINARY_NAME }}.exe --init release/config.toml.example
          else
            ./release/${{ env.BINARY_NAME }} --init release/config.toml.example
          fi
          cp -r proto release/
          cp README.md release/
          cp LICENSE release/

      - name: Create release archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd release
          tar -czvf ../fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz *

      - name: Create release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path release/* -DestinationPath fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.zip

      - name: Generate checksums
        shell: bash
        run: |
          archive=fast_code_search-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            fast_code_search-*.${{ matrix.archive }}
            fast_code_search-*.${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Every archive is signed keylessly through Sigstore: the signature is
      # bound to this workflow's OIDC identity, so a download can be checked
      # against the repository and tag it claims to come from, not just a
      # checksum that travelled with it.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the archives (Sigstore keyless)
        run: |
          cd artifacts
          for f in fast_code_search-*.tar.gz fast_code_search-*.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la

      - name: Extract changelog for version
        id: changelog
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_NUM="${VERSION#v}"
          
          if [ -f CHANGELOG.md ]; then
            # Extract content between this version header and next version header
            # Match: ## [0.2.4] - date  until next ## [
            NOTES=$(awk -v ver="$VERSION_NUM" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) { exit }
                if (index($0, "[" ver "]") > 0) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md)
            
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          else
            NOTES="Release ${VERSION}"
          fi
          
          # Write to file for multiline support
          {
            echo "$NOTES"
            echo
            echo "## Install"
            echo
            echo "Download the archive for your platform below, unpack it, and put \`fast_code_search_server\` and \`fcs\` on your \`PATH\`."
            echo "Each archive also contains \`config.toml.example\`, the startup unit files (\`deploy/\`) and the CLI and startup guides."
            echo
            echo "| Platform | Archive |"
            echo "|---|---|"
            echo "| Linux x86_64 (glibc) | \`fast_code_search-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| Linux x86_64 (static, musl) | \`fast_code_search-${VERSION}-x86_64-unknown-linux-musl.tar.gz\` |"
            echo "| macOS Apple silicon | \`fast_code_search-${VERSION}-aarch64-apple-darwin.tar.gz\` |"
            echo "| macOS Intel | \`fast_code_search-${VERSION}-x86_64-apple-darwin.tar.gz\` |"
            echo "| Windows x86_64 | \`fast_code_search-${VERSION}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "Verify a download with the \`.sha256\` file next to it: \`sha256sum -c fast_code_search-${VERSION}-<target>.tar.gz.sha256\`."
            echo "Each archive is also signed through Sigstore; with [cosign](https://docs.sigstore.dev/cosign/installation/) installed:"
            echo
            echo "\`\`\`bash"
            echo "cosign verify-blob --bundle fast_code_search-${VERSION}-<target>.tar.gz.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/jburrow/fast_code_search/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  fast_code_search-${VERSION}-<target>.tar.gz"
            echo "\`\`\`"
            echo
            echo "Other ways to install: \`cargo binstall fast_code_search\` (downloads these archives), \`cargo install fast_code_search\` (builds from crates.io), or the container image \`ghcr.io/jburrow/fast_code_search:${VERSION#v}\`."
            echo
            echo "First run: \`fast_code_search_server --init config.toml\`, add your paths, start the server, then \`fcs 'fn main'\`."
            echo "Full changelog: https://github.com/jburrow/fast_code_search/blob/main/CHANGELOG.md"
          } > release_notes.md
          
          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Homebrew tap, when a HOMEBREW_TAP_TOKEN secret (a token that can push to
  # jburrow/homebrew-tap) is configured. The formula is generated from the
  # archives' checksums, so it can only describe what was actually released.
  homebrew:
    name: Update the Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a tap token
        id: token
        run: echo "present=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Download checksums
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Generate and push the formula
        if: steps.token.outputs.present == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/jburrow/homebrew-tap.git" tap
          mkdir -p tap/Formula
          python3 scripts/release/homebrew-formula.py "$tag" artifacts > tap/Formula/fast_code_search.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fast_code_search.rb
          git commit -m "fast_code_search $tag" || { echo "formula unchanged"; exit 0; }
          git push
      - name: No token
        if: steps.token.outputs.present != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap. Create jburrow/homebrew-tap and add a token that can push to it."

  # crates.io, when a CARGO_REGISTRY_TOKEN secret is configured. Idempotent:
  # a version that is already published is reported and skipped.
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a registry token
        id: token
        run: echo "present=${{ secrets.CARGO_REGISTRY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Install Protoc
        if: steps.token.outputs.present == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust toolchain
        if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: cargo publish
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if curl -fsS -A fast_code_search-release "https://crates.io/api/v1/crates/fast_code_search/$version" >/dev/null 2>&1; then
            echo "fast_code_search $version is already on crates.io"; exit 0
          fi
          cargo publish --locked
      - name: No token
        if: steps.token.outputs.present != 'true'
        run: echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io. Add it under Settings → Secrets to publish on the next tag."
