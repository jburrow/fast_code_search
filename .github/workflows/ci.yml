name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older runs; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      # Failed test names, panics and crashes are echoed as workflow
      # annotations so they show up in the checks API and the PR without
      # opening the (login-only) log. If nothing matched (e.g. a test binary
      # died from a signal), the tail of the log is echoed instead.
      - name: Run tests
        shell: bash
        run: |
          # GitHub runs bash steps with -e, so the failing pipeline must be
          # caught here or the annotation script below never runs.
          set -o pipefail
          status=0
          cargo test --verbose --no-fail-fast 2>&1 | tee test.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-test-log.sh test.log
          fi
          exit "$status"

      # Fault points (src/faults.rs) are compiled in only with this feature:
      # failed reads and panics injected into the indexer and watcher.
      - name: Run fault-injection tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo test --verbose --features failpoints --test fault_injection --no-fail-fast 2>&1 | tee test-faults.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-test-log.sh test-faults.log
          fi
          exit "$status"

      # The index lifecycle against a naive model (tests/lifecycle_model.rs)
      # runs 48 random sequences in the step above; more here, on one OS,
      # with a fixed seed on pull requests.
      - name: Run the lifecycle model longer
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PROPTEST_RNG_SEED: ${{ github.event_name == 'pull_request' && '1' || github.run_id }}
        run: |
          set -o pipefail
          status=0
          PROPTEST_CASES=600 cargo test --release --test lifecycle_model --no-fail-fast 2>&1 | tee test-model.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-test-log.sh test-model.log
          fi
          exit "$status"

      # The contract walk (tests/contract_walk.rs) runs in the step above
      # without its browser leg; here with it: the web page in headless
      # Chromium, LOAD MORE and "Show N more hits" pressed to the end, must
      # show the same hits in the same order as every other surface.
      - name: Walk every surface, the web page included
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          status=0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" FCS_REQUIRE_BROWSER=1 \
            cargo test --release --test contract_walk --no-fail-fast 2>&1 | tee test-walk.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-test-log.sh test-walk.log
          fi
          exit "$status"

      - name: Run tests (semantic feature)
        shell: bash
        run: |
          # GitHub runs bash steps with -e, so the failing pipeline must be
          # caught here or the annotation script below never runs.
          set -o pipefail
          status=0
          cargo test --verbose --features semantic --lib --no-fail-fast 2>&1 | tee test-semantic.log || status=$?
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/annotate-test-log.sh test-semantic.log
          fi
          exit "$status"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Syntax-check the web UI scripts
        run: node --check static/keyword.js && node --check static/common.js && node --check static/semantic.js && node --check static/lib/keyword-helpers.js && node --check static/lib/graph-helpers.js && node --check static/graph.js

      - name: Generated reference pages are up to date
        run: |
          cargo build --release --bin fcs --bin fast_code_search_server
          scripts/docs/generate-reference.sh
          git diff --exit-code docs/book/src/reference || {
            echo "::error::docs/book/src/reference is stale: run scripts/docs/generate-reference.sh and commit"; exit 1; }

      - name: Run clippy (all targets and features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: cargo-deny (advisories, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  ui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the helper tests (node --test static/tests)
        run: npm test

      - name: Build Tailwind
        run: npm run build:css

      # The Tailwind build is committed and embedded into the binary; it must
      # match the markup it was built from.
      - name: Check the committed tailwind.css is current
        run: git diff --exit-code static/tailwind.css

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check with MSRV
        run: cargo +1.89 check --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Generate HTML coverage report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-html/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
