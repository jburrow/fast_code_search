<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Index Diagnostics — Fast Code Search</title>
    <link rel="stylesheet" href="/tailwind.css"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <style>
        /* Inline SVG icons: sized by their width/height attributes, coloured by the text colour */
        .icon { display: inline-block; fill: currentColor; vertical-align: middle; flex-shrink: 0; }
        body {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%237a785f' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
        }
        :root {
            --bg-primary: #fefae4; --bg-secondary: #f2eed9; --bg-tertiary: #ece9d4;
            --text-primary: #1d1c0f; --text-secondary: #494831; --text-muted: #7a785f;
            --accent: #646100; --accent-hover: #4b4900; --success: #1e6868; --warning: #6a6707;
            --error: #ba1a1a; --border: #cbc8aa; --code-bg: #f8f4df; --code-text: #1d1c0f;
            --color-path: #646100; --color-deps: #1e6868;
            --shadow: rgba(29,28,15,0.08); --shadow-lg: rgba(29,28,15,0.16);
        }
        /* Override rounded corners for new design */
        .card { border-radius: 0 !important; box-shadow: 2px 2px 0 rgba(0,0,0,0.12); }
        .stat-item { border-radius: 0 !important; }
        .test-results { border-radius: 0 !important; }
        .sample-files { border-radius: 0 !important; }
        .test-details { border-radius: 0 !important; }
        .status-banner { border-radius: 0 !important; }
        .card h3 { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .refresh-btn {
            background: #fff900 !important; color: #000 !important;
            border: 1px solid #000 !important; border-radius: 0 !important;
            padding: 0.5rem 1rem; cursor: pointer; font-size: 0.78rem;
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em;
            display: flex; align-items: center; gap: 0.5rem; margin-left: auto;
            transition: background 0.1s, color 0.1s;
        }
        .refresh-btn:hover { background: #000 !important; color: #fff900 !important; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .refresh-btn.loading::after {
            content: ''; width: 14px; height: 14px;
            border: 2px solid transparent; border-top-color: currentColor;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
        }
        .diagnostics-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .diagnostics-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .diagnostics-header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .back-link:hover {
            color: var(--accent-hover);
        }

        .status-banner {
            padding: 1rem 1.5rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-banner.healthy {
            background: color-mix(in srgb, var(--success) 10%, transparent);
            border: 1px solid var(--success);
        }

        .status-banner.degraded {
            background: color-mix(in srgb, var(--warning) 10%, transparent);
            border: 1px solid var(--warning);
        }

        .status-banner.unhealthy {
            background: color-mix(in srgb, var(--error) 10%, transparent);
            border: 1px solid var(--error);
        }

        .status-icon {
            font-size: 2rem;
        }

        .status-text h2 {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }

        .status-text p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
        }

        .card h3 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .stat-item {
            background: var(--bg-primary);
            padding: 0.75rem;
            border-radius: 4px;
        }

        .stat-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 600;
        }

        .extension-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .extension-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .extension-item:last-child {
            border-bottom: none;
        }

        .extension-name {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: var(--color-path);
            font-size: 0.825rem;
        }

        .extension-count {
            color: var(--text-secondary);
        }

        .test-results {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .test-results-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-results-header h3 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .test-summary {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
        }

        .test-summary .passed {
            color: var(--success);
        }

        .test-summary .failed {
            color: var(--error);
        }

        .test-list {
            list-style: none;
        }

        .test-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .test-item:last-child {
            border-bottom: none;
        }

        .test-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .test-icon.pass {
            color: var(--success);
        }

        .test-icon.fail {
            color: var(--error);
        }

        .test-content {
            flex: 1;
        }

        .test-name {
            font-weight: 500;
            font-family: monospace;
        }

        .test-message {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .test-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-family: monospace;
            background: var(--bg-primary);
            padding: 0.5rem;
            border-radius: 4px;
        }

        .test-duration {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .sample-files {
            background: var(--bg-primary);
            border-radius: 4px;
            padding: 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
        }

        .sample-file {
            padding: 0.25rem 0;
            color: var(--text-secondary);
            word-break: break-all;
        }

        .meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .error-state {
            text-align: center;
            padding: 3rem;
            color: var(--error);
        }
    </style>
</head>

<body class="bg-background text-on-background font-body min-h-screen pb-16 md:pb-0">

    <!-- Inline SVG icon sprite (Material Design icon paths, Apache-2.0); referenced
         with <svg class="icon"><use href="#i-name"/></svg>. Replaces the 3.9 MB icon font. -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="i-help-outline" viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></symbol>
        <symbol id="i-analytics" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></symbol>
        <symbol id="i-description" viewBox="0 0 24 24"><path d="M8 16h8v2H8zm0-4h8v2H8zm6-10H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></symbol>
        <symbol id="i-auto-awesome" viewBox="0 0 24 24"><path d="m19 9 1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></symbol>
    </svg>

    <header class="bg-white font-label uppercase tracking-tighter text-sm flex justify-between items-center w-full px-6 h-14 sticky top-0 z-50 border-b border-black">
        <div class="flex items-center gap-6">
            <div class="text-base font-bold font-label text-black bg-primary-container px-2 py-0.5 border border-black">FAST_CODE_SEARCH</div>
            <nav class="hidden md:flex items-center gap-0 h-14">
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/">SEARCH</a>
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/semantic.html">SEMANTIC</a>
                <a class="h-full flex items-center px-3 bg-primary-container border-b-2 border-black text-black font-bold transition-colors duration-75" href="/diagnostics.html">INDEX</a>
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/docs.html">DOCS</a>
            </nav>
        </div>
        <a href="/docs.html" class="text-outline hover:text-black transition-colors flex items-center" title="Documentation" aria-label="Documentation"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-help-outline"/></svg></a>
    </header>

    <main class="max-w-[1440px] mx-auto p-6">
        <div id="content">
            <div style="text-align:center;padding:3rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:#7a785f;">
                Loading diagnostics...
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-14 bg-white font-label text-[10px] uppercase border-t border-black">
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-search"/></svg><span>Search</span></a>
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/semantic.html"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-auto-awesome"/></svg><span>Semantic</span></a>
        <a class="flex flex-col items-center justify-center bg-primary-container text-black px-4 py-1" href="/diagnostics.html"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-analytics"/></svg><span>Index</span></a>
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/docs.html"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-description"/></svg><span>Docs</span></a>
    </nav>

    <script>
        let isLoading = false;

        async function loadDiagnostics(forceRefresh = false) {
            if (isLoading) return;
            isLoading = true;

            const content = document.getElementById('content');
            const refreshBtn = document.getElementById('refresh-btn');

            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.classList.add('loading');
            }

            try {
                const url = `/api/diagnostics?force_refresh=${forceRefresh}&sample_count=10`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                renderDiagnostics(data);
            } catch (error) {
                content.innerHTML = `
                    <div class="error-state">
                        <h2>Failed to load diagnostics</h2>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="refresh-btn" onclick="loadDiagnostics(true)">🔄 Retry</button>
                    </div>
                `;
            } finally {
                isLoading = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.classList.remove('loading');
                }
            }
        }

        function renderDiagnostics(data) {
            // Every string below comes from the server and, through it, from
            // file names in arbitrary indexed repositories: escape all of them.
            const status = ['healthy', 'degraded', 'unhealthy'].includes(data.status) ? data.status : 'unhealthy';
            const statusIcon = status === 'healthy' ? '✅' :
                status === 'degraded' ? '⚠️' : '❌';
            const statusText = status === 'healthy' ? 'All Systems Operational' :
                status === 'degraded' ? 'Degraded Performance' : 'System Unhealthy';
            const index = data.index || {};
            const config = data.config || {};
            const summary = data.test_summary || {};

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="status-banner ${status}">
                    <span class="status-icon">${statusIcon}</span>
                    <div class="status-text">
                        <h2>${statusText}</h2>
                        <p>Version ${escapeHtml(data.version)} • Uptime: ${escapeHtml(data.uptime_human)}</p>
                    </div>
                    <button id="refresh-btn" class="refresh-btn" onclick="loadDiagnostics(true)">
                        🔄 Refresh
                    </button>
                </div>

                <div class="cards-grid">
                    <div class="card">
                        <h3>📊 Index Statistics</h3>
                        <div class="stat-grid">
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.num_files)}</div>
                                <div class="label">Files Indexed</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${escapeHtml(index.total_size_human)}</div>
                                <div class="label" title="File content currently mapped into memory by searches">Mapped Content</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.num_trigrams)}</div>
                                <div class="label">Trigrams</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.dependency_edges)}</div>
                                <div class="label">Dependencies</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>📁 Files by Extension</h3>
                        <div class="extension-list">
                            ${(index.files_by_extension || []).slice(0, 10).map(ext => `
                                <div class="extension-item">
                                    <span class="extension-name">${escapeHtml(extensionLabel(ext.extension))}</span>
                                    <span class="extension-count">${fmtNum(ext.count)} files</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>📂 Sample Indexed Files</h3>
                        <div class="sample-files">
                            ${(index.sample_files || []).map(f => `
                                <div class="sample-file">${escapeHtml(f)}</div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>⚙️ Configuration</h3>
                        <div class="sample-files">
                            <div class="sample-file"><strong>Indexed Paths:</strong></div>
                            ${(config.indexed_paths || []).map(p => `
                                <div class="sample-file">&nbsp;&nbsp;${escapeHtml(p)}</div>
                            `).join('')}
                            ${(config.exclude_patterns || []).length > 0 ? `
                                <div class="sample-file" style="margin-top: 0.5rem;"><strong>Exclusions:</strong></div>
                                ${config.exclude_patterns.slice(0, 5).map(p => `
                                    <div class="sample-file">&nbsp;&nbsp;${escapeHtml(p)}</div>
                                `).join('')}
                            ` : ''}
                            <div class="sample-file" style="margin-top: 0.5rem;">
                                <strong>File Watcher:</strong> ${config.watch_enabled ? 'Enabled' : 'Disabled'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="test-results">
                    <div class="test-results-header">
                        <h3>🧪 Self-Test Results</h3>
                        <div class="test-summary">
                            <span class="passed">✓ ${fmtNum(summary.passed)} passed</span>
                            <span class="failed">${summary.failed > 0 ? '✗ ' + fmtNum(summary.failed) + ' failed' : ''}</span>
                            <span>• ${fmtNum(summary.total_duration_ms, 1)}ms total</span>
                        </div>
                    </div>
                    <ul class="test-list">
                        ${(data.self_tests || []).map(test => `
                            <li class="test-item">
                                <span class="test-icon ${test.passed ? 'pass' : 'fail'}">
                                    ${test.passed ? '✓' : '✗'}
                                </span>
                                <div class="test-content">
                                    <div class="test-name">${escapeHtml(test.name)}</div>
                                    <div class="test-message">${escapeHtml(test.message)}</div>
                                    ${test.details ? `<div class="test-details">${escapeHtml(test.details)}</div>` : ''}
                                </div>
                                <span class="test-duration">${fmtNum(test.duration_ms, 1)}ms</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div class="meta-info">
                    <span>Generated: ${escapeHtml(data.generated_at)}</span>
                    <span>Server Type: Keyword Search (Trigram-based)</span>
                </div>
            `;
        }

        // Quote-escaping (same as common.js, which this page does not load) so a
        // value is safe both as element text and inside an attribute value. The
        // textContent/innerHTML trick did not escape quotes.
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Numbers go through this so a missing or non-numeric field renders as
        // "-" instead of throwing inside the template.
        function fmtNum(n, digits) {
            if (typeof n !== 'number' || !isFinite(n)) return '-';
            return digits === undefined ? n.toLocaleString() : n.toFixed(digits);
        }

        // The server buckets files without an extension under "(none)".
        function extensionLabel(ext) {
            if (!ext || ext === '(none)') return 'no extension';
            return '.' + ext;
        }

        // Load on page load
        loadDiagnostics();

        // Auto-refresh every 60 seconds
        setInterval(() => loadDiagnostics(false), 60000);
    </script>
</body>

</html>
