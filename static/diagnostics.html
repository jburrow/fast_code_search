<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Index Diagnostics — Fast Code Search</title>
    <!-- Theme first, so the page paints in the right colours (theme.js) -->
    <script src="/ui-config.js"></script>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tailwind.css"/>
    <link rel="stylesheet" href="/app.css"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <style>
        .extension-list { max-height: 200px; overflow-y: auto; }
        .extension-item { display: flex; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border); }
        .extension-item:last-child { border-bottom: none; }
        .extension-name { font-family: var(--font-mono); color: var(--accent-ink); font-size: 0.825rem; }
        .extension-count { color: var(--text-2); }
    </style>
</head>

<body class="bg-background text-on-background font-body min-h-screen pb-16 md:pb-0">


    <!-- Shared header, icon sprite and phone tab bar (shell.js) -->
    <script src="/shell.js" data-page="index"></script>

    <main class="max-w-[1440px] mx-auto p-6">
        <div id="content">
            <div class="loading">
                Loading diagnostics…
            </div>
        </div>
    </main>


    <script>
        let isLoading = false;

        async function loadDiagnostics(forceRefresh = false) {
            if (isLoading) return;
            isLoading = true;

            const content = document.getElementById('content');
            const refreshBtn = document.getElementById('refresh-btn');

            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.classList.add('loading');
            }

            try {
                const url = `/api/diagnostics?force_refresh=${forceRefresh}&sample_count=10`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                renderDiagnostics(data);
            } catch (error) {
                content.innerHTML = `
                    <div class="error-state">
                        <h2>Failed to load diagnostics</h2>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" onclick="loadDiagnostics(true)">Retry</button>
                    </div>
                `;
            } finally {
                isLoading = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.classList.remove('loading');
                }
            }
        }

        // Running APIs, where the index is saved, and problems to fix (a busy
        // port, an index owned by another server, low disk space or inodes).
        function renderService(service) {
            if (!service || !service.persistence) return '';
            const problems = service.problems || [];
            const row = (label, value) => `
                <div class="sample-file"><strong>${label}:</strong> ${escapeHtml(value || 'unknown')}</div>`;
            return `
                <div class="card" style="margin-bottom: 1.5rem;">
                    <h3>Service</h3>
                    <div class="sample-files">
                        ${row('Web UI / REST', service.web_ui)}
                        ${row('gRPC', service.grpc)}
                        ${row('Index persistence', service.persistence)}
                    </div>
                    ${problems.length > 0 ? `
                        <div class="sample-files" style="margin-top: 0.75rem;">
                            <div class="sample-file"><strong>Problems (${problems.length}):</strong></div>
                            ${problems.map(p => `
                                <div class="sample-file" style="white-space: normal; color: var(--warn);">${escapeHtml(p)}</div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>`;
        }

        // The background scrub: files checked against the disk, and any the
        // index had out of step (each was queued to index again).
        function renderScrub(scrub) {
            if (!scrub) return '';
            const n = (v) => Number(v || 0).toLocaleString('en-US');
            const drift = Object.entries(scrub.drift || {});
            const driftTotal = drift.reduce((a, [, v]) => a + Number(v || 0), 0);
            const violations = Object.entries(scrub.invariant_violations || {});
            const row = (label, value, warn) => `
                <div class="sample-file"${warn ? ' style="color: var(--warn);"' : ''}><strong>${label}:</strong> ${escapeHtml(value)}</div>`;
            return `
                <div class="card" style="margin-bottom: 1.5rem;">
                    <h3>Index scrub</h3>
                    <div class="sample-files">
                        ${row('Files checked against disk', `${n(scrub.files_checked)} (${n(scrub.passes)} full passes)`)}
                        ${row('Out of step', driftTotal === 0 ? 'none'
                            : `${n(driftTotal)}: ${drift.map(([k, v]) => `${k} ${n(v)}`).join(', ')}; queued to index again`, driftTotal > 0)}
                        ${row('Consistency checks', scrub.invariant_checks === 0 ? 'not run yet'
                            : `${n(scrub.invariant_checks)}, last ${violations.length === 0 ? 'clean'
                                : violations.map(([k, v]) => `${k} ${n(v)}`).join(', ')} (${n(scrub.last_invariant_check_ms)} ms)`, violations.length > 0)}
                    </div>
                </div>`;
        }

        function renderDiagnostics(data) {
            // Every string below comes from the server and, through it, from
            // file names in arbitrary indexed repositories: escape all of them.
            const status = ['healthy', 'degraded', 'unhealthy'].includes(data.status) ? data.status : 'unhealthy';
            const statusIcon = {healthy: 'i-check', degraded: 'i-warning'}[status] || 'i-error';
            const statusText = status === 'healthy' ? 'All systems operational' :
                status === 'degraded' ? 'Degraded performance' : 'Unhealthy';
            const index = data.index || {};
            const config = data.config || {};
            const summary = data.test_summary || {};

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="status-banner ${status}">
                    <span class="status-icon"><svg class="icon" width="32" height="32" aria-hidden="true"><use href="#${statusIcon}"/></svg></span>
                    <div class="status-text">
                        <h2>${statusText}</h2>
                        <p>Version ${escapeHtml(data.version)} · uptime ${escapeHtml(data.uptime_human)}</p>
                    </div>
                    <button id="refresh-btn" class="btn btn-primary" onclick="loadDiagnostics(true)">Refresh</button>
                </div>

                ${renderService(data.service)}
                ${renderScrub(data.scrub)}

                <div class="cards-grid">
                    <div class="card">
                        <h3>Index statistics</h3>
                        <div class="stat-grid">
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.num_files)}</div>
                                <div class="label">Files indexed</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${escapeHtml(index.total_size_human)}</div>
                                <div class="label" title="Total size of the indexed files">Indexed content</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.num_trigrams)}</div>
                                <div class="label">Trigrams</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${fmtNum(index.dependency_edges)}</div>
                                <div class="label">Dependencies</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Files by extension</h3>
                        <div class="extension-list">
                            ${(index.files_by_extension || []).slice(0, 10).map(ext => `
                                <div class="extension-item">
                                    <span class="extension-name">${escapeHtml(extensionLabel(ext.extension))}</span>
                                    <span class="extension-count">${fmtNum(ext.count)} files</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>Sample indexed files</h3>
                        <div class="sample-files">
                            ${(index.sample_files || []).map(f => `
                                <div class="sample-file">${escapeHtml(f)}</div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>Configuration</h3>
                        <div class="sample-files">
                            <div class="sample-file"><strong>Indexed paths:</strong></div>
                            ${(config.indexed_paths || []).map(p => `
                                <div class="sample-file">&nbsp;&nbsp;${escapeHtml(p)}</div>
                            `).join('')}
                            ${(config.exclude_patterns || []).length > 0 ? `
                                <div class="sample-file" style="margin-top: 0.5rem;"><strong>Exclusions:</strong></div>
                                ${config.exclude_patterns.slice(0, 5).map(p => `
                                    <div class="sample-file">&nbsp;&nbsp;${escapeHtml(p)}</div>
                                `).join('')}
                            ` : ''}
                            <div class="sample-file" style="margin-top: 0.5rem;">
                                <strong>File watcher:</strong> ${config.watch_enabled ? 'Enabled' : 'Disabled'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="test-results">
                    <div class="test-results-header">
                        <h3>Self-test results</h3>
                        <div class="test-summary">
                            <span class="passed">✓ ${fmtNum(summary.passed)} passed</span>
                            <span class="failed">${summary.failed > 0 ? '✗ ' + fmtNum(summary.failed) + ' failed' : ''}</span>
                            <span>• ${fmtNum(summary.total_duration_ms, 1)}ms total</span>
                        </div>
                    </div>
                    <ul class="test-list">
                        ${(data.self_tests || []).map(test => `
                            <li class="test-item">
                                <span class="test-icon ${test.passed ? 'pass' : 'fail'}"><svg class="icon" width="18" height="18" aria-label="${test.passed ? 'Passed' : 'Failed'}"><use href="#${test.passed ? 'i-check' : 'i-error'}"/></svg></span>
                                <div class="test-content">
                                    <div class="test-name">${escapeHtml(test.name)}</div>
                                    <div class="test-message">${escapeHtml(test.message)}</div>
                                    ${test.details ? `<div class="test-details">${escapeHtml(test.details)}</div>` : ''}
                                </div>
                                <span class="test-duration">${fmtNum(test.duration_ms, 1)}ms</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div class="meta-info">
                    <span>Generated: ${escapeHtml(data.generated_at)}</span>
                    <span>Server: keyword search (trigram index)</span>
                </div>
            `;
        }

        // Quote-escaping (same as common.js, which this page does not load) so a
        // value is safe both as element text and inside an attribute value. The
        // textContent/innerHTML trick did not escape quotes.
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Numbers go through this so a missing or non-numeric field renders as
        // "-" instead of throwing inside the template.
        function fmtNum(n, digits) {
            if (typeof n !== 'number' || !isFinite(n)) return '-';
            return digits === undefined ? n.toLocaleString() : n.toFixed(digits);
        }

        // The server buckets files without an extension under "(none)".
        function extensionLabel(ext) {
            if (!ext || ext === '(none)') return 'no extension';
            return '.' + ext;
        }

        // Load on page load
        loadDiagnostics();

        // Auto-refresh every 60 seconds
        setInterval(() => loadDiagnostics(false), 60000);
    </script>
</body>

</html>
