<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Semantic Diagnostics — Fast Code Search</title>
    <!-- Theme first, so the page paints in the right colours (theme.js) -->
    <script src="/ui-config.js"></script>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tailwind.css"/>
    <link rel="stylesheet" href="/app.css"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <style>
        .model-info { background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 0 1rem; }
        .model-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
        .model-row:last-child { border-bottom: none; }
        .model-label { color: var(--text-2); }
        .model-value { color: var(--text); font-family: var(--font-mono); }
        .model-value.success { color: var(--info); }
        .model-value.error { color: var(--danger); }
        .chunk-breakdown { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
        .chunk-item { background: var(--surface-1); border: 1px solid var(--border-soft); padding: 0.75rem; border-radius: var(--radius); text-align: center; }
        .chunk-item .value { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    </style>
</head>

<body class="bg-background text-on-background font-body min-h-screen pb-16 md:pb-0">

    <!-- Shared header, icon sprite and phone tab bar (shell.js) -->
    <script src="/shell.js" data-page="semantic"></script>

    <main class="max-w-[1440px] mx-auto p-6">
        <div id="content">
            <div class="loading">
                Loading diagnostics…
            </div>
        </div>
    </main>


    <script>
        let isLoading = false;

        async function loadDiagnostics(forceRefresh = false) {
            if (isLoading) return;
            isLoading = true;

            const content = document.getElementById('content');
            const refreshBtn = document.getElementById('refresh-btn');

            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.classList.add('loading');
            }

            try {
                const url = `/api/diagnostics?force_refresh=${forceRefresh}&sample_count=10`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                renderDiagnostics(data);
            } catch (error) {
                content.innerHTML = `
                    <div class="error-state">
                        <h2>Failed to load diagnostics</h2>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" onclick="loadDiagnostics(true)">Retry</button>
                    </div>
                `;
            } finally {
                isLoading = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.classList.remove('loading');
                }
            }
        }

        function renderDiagnostics(data) {
            const statusIcon = {healthy: 'i-check', degraded: 'i-warning'}[data.status] || 'i-error';
            const statusText = data.status === 'healthy' ? 'All systems operational' :
                data.status === 'degraded' ? 'Degraded performance' : 'Unhealthy';

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="status-banner ${data.status}">
                    <span class="status-icon"><svg class="icon" width="32" height="32" aria-hidden="true"><use href="#${statusIcon}"/></svg></span>
                    <div class="status-text">
                        <h2>${statusText}</h2>
                        <p>Version ${escapeHtml(data.version)} · uptime ${escapeHtml(data.uptime_human)}</p>
                    </div>
                    <button id="refresh-btn" class="btn btn-primary" onclick="loadDiagnostics(true)">Refresh</button>
                </div>

                <div class="cards-grid">
                    <div class="card">
                        <h3>Semantic index statistics</h3>
                        <div class="stat-grid">
                            <div class="stat-item">
                                <div class="value">${data.index.num_files.toLocaleString()}</div>
                                <div class="label">Files indexed</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${data.index.num_chunks.toLocaleString()}</div>
                                <div class="label">Code chunks</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${data.index.embedding_dim}</div>
                                <div class="label">Embedding dimension</div>
                            </div>
                            <div class="stat-item">
                                <div class="value">${data.index.cache_size.toLocaleString()}</div>
                                <div class="label">Cached queries</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Embedding model</h3>
                        <div class="model-info">
                            <div class="model-row">
                                <span class="model-label">Model name</span>
                                <span class="model-value">${escapeHtml(data.model.name)}</span>
                            </div>
                            <div class="model-row">
                                <span class="model-label">Model type</span>
                                <span class="model-value">${escapeHtml(data.model.model_type)}</span>
                            </div>
                            <div class="model-row">
                                <span class="model-label">Status</span>
                                <span class="model-value ${data.model.loaded ? 'success' : 'error'}">
                                    ${data.model.loaded ? '✓ Loaded' : '✗ Not loaded'}
                                </span>
                            </div>
                            <div class="model-row">
                                <span class="model-label">Embedding dimension</span>
                                <span class="model-value">${data.model.embedding_dim}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Chunks by type</h3>
                        <div class="chunk-breakdown">
                            <div class="chunk-item">
                                <div class="value">${data.index.chunks_by_type.functions}</div>
                                <div class="label">Functions</div>
                            </div>
                            <div class="chunk-item">
                                <div class="value">${data.index.chunks_by_type.classes}</div>
                                <div class="label">Classes</div>
                            </div>
                            <div class="chunk-item">
                                <div class="value">${data.index.chunks_by_type.modules}</div>
                                <div class="label">Modules</div>
                            </div>
                            <div class="chunk-item">
                                <div class="value">${data.index.chunks_by_type.fixed}</div>
                                <div class="label">Fixed chunks</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Sample indexed files</h3>
                        <div class="sample-files">
                            ${data.index.sample_files.length > 0 ?
                    data.index.sample_files.map(f => `
                                    <div class="sample-file">${escapeHtml(f)}</div>
                                `).join('') :
                    '<div class="sample-file">No files indexed yet</div>'
                }
                        </div>
                    </div>
                </div>

                <div class="test-results">
                    <div class="test-results-header">
                        <h3>Self-test results</h3>
                        <div class="test-summary">
                            <span class="passed">✓ ${data.test_summary.passed} passed</span>
                            <span class="failed">${data.test_summary.failed > 0 ? '✗ ' + data.test_summary.failed + ' failed' : ''}</span>
                            <span>• ${data.test_summary.total_duration_ms.toFixed(1)}ms total</span>
                        </div>
                    </div>
                    <ul class="test-list">
                        ${data.self_tests.map(test => `
                            <li class="test-item">
                                <span class="test-icon ${test.passed ? 'pass' : 'fail'}"><svg class="icon" width="18" height="18" aria-label="${test.passed ? 'Passed' : 'Failed'}"><use href="#${test.passed ? 'i-check' : 'i-error'}"/></svg></span>
                                <div class="test-content">
                                    <div class="test-name">${escapeHtml(test.name)}</div>
                                    <div class="test-message">${escapeHtml(test.message)}</div>
                                    ${test.details ? `<div class="test-details">${escapeHtml(test.details)}</div>` : ''}
                                </div>
                                <span class="test-duration">${test.duration_ms.toFixed(1)}ms</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div class="meta-info">
                    <span>Generated: ${data.generated_at}</span>
                    <span>Server: semantic search (vector embeddings)</span>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on page load
        loadDiagnostics();

        // Auto-refresh every 60 seconds
        setInterval(() => loadDiagnostics(false), 60000);
    </script>
</body>

</html>
