<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dependency Explorer — Fast Code Search</title>
    <!-- Theme first, so the page paints in the right colours (theme.js) -->
    <script src="/ui-config.js"></script>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/tailwind.css"/>
    <link rel="stylesheet" href="/app.css"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <style>
        /* Three panes under the app header: file picker | import graph | source.
           Stacks to one column on narrow screens. */
        :root { --dep: var(--accent-ink); --rdep: var(--info); }
        body { font-size: 14px; }
        :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 1px; }

        .app { height: calc(100vh - 3.5rem); display: grid; grid-template-rows: auto auto 1fr; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
        .bar h1 { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
        .tabs { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
        .tabs button { background: var(--surface); color: var(--text); border: 0; border-radius: 0; border-right: 1px solid var(--border); padding: 5px 12px; font-family: var(--font-label); font-size: 12px; cursor: pointer; text-transform: var(--label-case); letter-spacing: 0.04em; }
        .tabs button:last-child { border-right: 0; }
        .tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
        .tabs button:hover:not([aria-selected="true"]) { background: var(--hover); }
        .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); cursor: pointer; }
        .toggle input { accent-color: var(--accent-ink); }
        .stats { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

        .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--page); min-height: 42px; }
        /* Buttons are the shared .btn (app.css), a little smaller here. */
        .sub .btn, .srchead .btn { padding: 3px 10px; font-size: 11px; box-shadow: none; text-decoration: none; }
        select.btn { padding-right: 24px; }
        .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-family: var(--font-mono); font-size: 12px; min-width: 0; }
        .crumbs button { background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--text-3); }
        .crumbs button:hover { color: var(--text); text-decoration: underline; }
        .crumbs .cur { color: var(--text); font-weight: 600; padding: 2px 4px; }
        .crumbs i { color: var(--text-4); font-style: normal; }
        .summary { font-size: 13px; }
        .summary b { font-family: var(--font-mono); font-weight: 600; }
        .pathfields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
        .pathfields input { width: 300px; max-width: 100%; padding: 3px 8px; border: 1px solid var(--text-4); background: var(--surface); font-family: var(--font-mono); font-size: 12px; }

        .panes { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(0, 0.9fr); min-height: 0; }
        .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .pane:last-child { border-right: 0; }
        .pane-h { padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: var(--font-label); font-size: 11px; text-transform: var(--label-case); letter-spacing: 0.08em; color: var(--text-3); display: flex; gap: 8px; align-items: center; background: var(--surface-1); min-width: 0; }
        .pane-h span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* Never re-case a file name: paths inside labels use .as-typed (app.css). */

        .filter { margin: 8px; padding: 5px 8px; border: 1px solid var(--text-4); background: var(--surface); font-family: var(--font-mono); font-size: 12px; }
        .files { overflow: auto; flex: 1; padding-bottom: 8px; }
        .file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 6px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 3px 10px 3px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
        .file:hover { background: var(--surface-2); }
        .file.on { background: var(--accent-faint); border-left-color: var(--accent-ink); font-weight: 600; }
        .file .nm, .file .dr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file .dr { grid-column: 1 / -1; color: var(--text-3); font-size: 10.5px; font-weight: 400; direction: rtl; text-align: left; }
        .file .deg { color: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
        .files .note { padding: 6px 12px; color: var(--text-3); font-size: 11px; }

        .graphwrap { position: relative; flex: 1; overflow: auto; background: radial-gradient(circle, var(--border) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--page); }
        .graphwrap svg { display: block; margin: 0 auto; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); background: var(--surface-1); }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }

        .gnode { cursor: pointer; }
        .gnode rect.box { fill: var(--surface); stroke: var(--text-4); stroke-width: 1; }
        .gnode text.t { font-family: var(--font-mono); font-size: 12px; font-weight: 600; fill: var(--text); }
        .gnode text.s { font-family: var(--font-mono); font-size: 10px; fill: var(--text-3); }
        .gnode.center rect.box { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 2; }
        .gnode.dep rect.side { fill: var(--dep); }
        .gnode.rdep rect.side { fill: var(--rdep); }
        .gnode.test rect.box { stroke-dasharray: 4 3; }
        .gnode.preview rect.box { stroke: var(--text); stroke-width: 2; }
        .gnode.cyc rect.box { stroke: var(--danger); stroke-width: 2; }
        .gnode:hover rect.box, .gnode:focus-visible rect.box { stroke: var(--text); stroke-width: 2; }
        .gnode:focus { outline: none; }
        .gnode.more rect.box { fill: var(--surface-2); stroke-dasharray: 3 3; }
        .gnode.more text.t { font-weight: 500; fill: var(--text-3); }
        .gedge { fill: none; stroke: var(--text-4); stroke-width: 1.4; }
        .gedge.dep { stroke: var(--dep); opacity: 0.75; }
        .gedge.rdep { stroke: var(--rdep); opacity: 0.8; }
        .gedge.cyc { stroke: var(--danger); opacity: 0.95; }
        .gedge.mod { stroke-dasharray: 2 3; }
        .gedge.hl { stroke-width: 3; opacity: 1; }
        .ehit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
        .collabel { font-family: var(--font-label); font-size: 10.5px; fill: var(--text-3); letter-spacing: 0.06em; text-transform: var(--label-case); }
        .empty { padding: 40px 20px; text-align: center; color: var(--text-3); }
        .empty.err { color: var(--danger); }

        .tip { position: fixed; z-index: 60; pointer-events: none; background: var(--text); color: var(--page); padding: 6px 9px; font-family: var(--font-mono); font-size: 11px; max-width: 380px; line-height: 1.45; overflow-wrap: anywhere; }
        .tip[hidden] { display: none; }

        .srchead { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-1); display: grid; gap: 6px; }
        .srchead .p { font-family: var(--font-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
        .srchead .m { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
        .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; }
        .chips em { font-style: normal; color: var(--text-3); margin-right: 2px; font-family: var(--font-label); font-size: 10.5px; text-transform: var(--label-case); letter-spacing: 0.06em; }
        .chips .none { color: var(--text-3); }
        .chip { border: 1px solid var(--rdep); color: var(--rdep); background: transparent; padding: 1px 7px; border-radius: var(--radius); font-family: var(--font-mono); font-size: 11px; cursor: pointer; }
        .chip:hover { background: var(--info-wash); }
        .chip.out { border-color: var(--dep); color: var(--dep); }
        .chip.out:hover { background: var(--accent-faint); }
        .code { flex: 1; overflow: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; background: var(--surface); }
        .ln { display: grid; grid-template-columns: 56px minmax(0, 1fr); }
        .ln .n { text-align: right; padding-right: 10px; color: var(--text-3); user-select: none; font-variant-numeric: tabular-nums; border-right: 1px solid var(--border); }
        .ln .c { padding-left: 10px; white-space: pre; }
        .ln.imp { background: var(--accent-faint); }
        .ln.imp .n { color: var(--accent-ink-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent-ink); }
        .ln.ext { background: var(--surface-2); }
        .ln.flash { animation: flash 1.2s ease-out; }
        @keyframes flash { from { background: var(--accent-soft); } }
        .go { margin-left: 10px; border: 1px solid var(--dep); color: var(--dep); background: var(--surface); font-size: 10.5px; padding: 0 6px; cursor: pointer; border-radius: var(--radius); }
        .go:hover { background: var(--accent-soft); color: var(--text); }
        .go.mod { border-style: dashed; }
        .extag { margin-left: 10px; color: var(--text-3); font-size: 10.5px; border: 1px solid var(--border); padding: 0 6px; border-radius: var(--radius); }
        .code .more-lines { display: block; width: 100%; padding: 4px; background: var(--surface-2); border: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--text-3); cursor: pointer; }
        .code .more-lines:hover { color: var(--text); background: var(--accent-faint); }

        @media (prefers-reduced-motion: reduce) { .ln.flash { animation: none; } }
        @media (max-width: 900px) {
            .app { height: auto; }
            .panes { grid-template-columns: minmax(0, 1fr); }
            .pane { border-right: 0; border-bottom: 1px solid var(--border); }
            .pane.files-pane .files { max-height: 220px; }
            .graphwrap { height: 60vh; flex: none; }
            .code { max-height: 70vh; }
            .stats { margin-left: 0; width: 100%; }
        }
    </style>
</head>

<body class="bg-background text-on-background font-body min-h-screen pb-16 md:pb-0">


    <!-- Shared header, icon sprite and phone tab bar (shell.js) -->
    <script src="/shell.js" data-page="graph"></script>

    <div class="app">
        <div class="bar">
            <h1>Dependency explorer</h1>
            <div class="tabs" role="tablist" aria-label="Graph view">
                <button role="tab" data-mode="hood" aria-selected="true">Neighbourhood</button>
                <button role="tab" data-mode="impact" aria-selected="false">Impact</button>
                <button role="tab" data-mode="path" aria-selected="false">Path</button>
                <button role="tab" data-mode="map" aria-selected="false">Module map</button>
            </div>
            <label class="toggle" for="modToggle" title="Rust `mod foo;` declares a child module. It is structure rather than a dependency, and would put every parent and child module in a cycle."><input type="checkbox" id="modToggle"> Show <code>mod</code> declarations</label>
            <div class="stats" id="stats"></div>
        </div>
        <div class="sub" id="sub"></div>
        <div class="panes">
            <section class="pane files-pane" aria-label="Files">
                <div class="pane-h"><span class="t">Files</span><span style="margin-left:auto">in · out</span></div>
                <input class="filter" id="filter" type="search" placeholder="Filter files…" aria-label="Filter files">
                <div class="files" id="files"></div>
            </section>
            <section class="pane" aria-label="Import graph">
                <div class="pane-h"><span class="t" id="graphTitle">Import graph</span></div>
                <div class="graphwrap" id="graphwrap"></div>
                <div class="legend" id="legend"></div>
            </section>
            <section class="pane" aria-label="Source">
                <div class="srchead" id="srchead"></div>
                <div class="code" id="code"></div>
            </section>
        </div>
    </div>
    <div class="tip" id="tip" hidden></div>
    <datalist id="allfiles"></datalist>


    <script src="/highlight.min.js"></script>
    <script src="/highlight-languages.min.js"></script>
    <script src="/common.js"></script>
    <script src="/lib/keyword-helpers.js"></script>
    <script src="/lib/graph-helpers.js"></script>
    <script src="/graph.js"></script>
</body>
</html>
