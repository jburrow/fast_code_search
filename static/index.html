<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- Set to "true" (or define window.SEMANTIC_ENABLED) when the semantic
         server runs on port 8081: the page then probes it for the status badge.
         Left false, no probe is made (a refused probe logs a console error). -->
    <meta name="fcs-semantic-enabled" content="false"/>
    <title>Fast Code Search</title>
    <link rel="stylesheet" href="/tailwind.css"/>
    <link rel="stylesheet" href="/fonts.css"/>
    <!-- The page is a hard-coded light theme (result code is on a white background),
         so always use the light highlight.js theme. Loading the dark theme under
         prefers-color-scheme:dark rendered pale tokens on white = unreadable. -->
    <link rel="stylesheet" href="/highlight-light.min.css">
    <style>
        /* Language badge color variables (from common.css) */
        :root {
            --lang-rs: #d44e38; --lang-py: #3d6fad; --lang-js: #d9a41a; --lang-ts: #2f6bbf;
            --lang-go: #38a0b0; --lang-rb: #b83a28; --lang-java: #cc7a1a; --lang-cs: #2e7c4f;
            --lang-cpp: #b84030; --lang-c: #5c4fbf; --lang-sh: #2e7c50; --lang-yaml: #8e3fad;
            --lang-json: #b89010; --lang-css: #4040cc; --lang-proto: #7a28ad;
            --lang-toml: #a06018; --lang-sql: #b07818; --lang-md: #4a5a6a;
            --hl-line-bg: #fff900;
            --hl-left-border: #646100;
        }
        /* Inline SVG icons: sized by their width/height attributes, coloured by the text colour */
        .icon { display: inline-block; fill: currentColor; vertical-align: middle; flex-shrink: 0; }
        body {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%237a785f' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
        }
        /* Search hit highlight */
        mark.highlight, .code-highlight {
            background-color: var(--hl-line-bg);
            color: #000;
            padding: 0 2px;
            border-radius: 0;
            font-style: inherit;
            font-weight: bold;
        }
        /* Result code block — neutralise hljs background */
        .result-code, .result-code.hljs {
            background: #fff !important;
            color: inherit;
            margin: 0;
            padding: 0.625rem 1rem;
            font-size: 0.78rem;
            line-height: 1.55;
            overflow-x: auto;
            white-space: pre;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        /* Context tooltip */
        .ctx-tooltip {
            position: fixed;
            z-index: 2000;
            display: none;
            max-width: none;
            min-width: 280px;
            background: #fff;
            border: 1px solid #000;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            flex-direction: column;
            box-shadow: 4px 4px 0 #000;
        }
        .ctx-header {
            padding: 0.35rem 0.75rem;
            background: #dedac6;
            border-bottom: 1px solid #000;
            font-size: 0.72rem;
            color: #494831;
            font-family: 'JetBrains Mono', monospace;
        }
        .ctx-file-body {
            overflow-y: auto;
            flex: 1;
        }
        .ctx-loading {
            padding: 1rem;
            color: #5f5d48;
        }
        /* Deps popover */
        .deps-popover {
            position: fixed;
            z-index: 2001;
            display: none;
            min-width: 200px;
            max-width: 360px;
            background: #fff;
            border: 1px solid #000;
            box-shadow: 4px 4px 0 #000;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }
        .deps-popover-header {
            padding: 0.3rem 0.65rem;
            background: #dedac6;
            border-bottom: 1px solid #cbc8aa;
            color: #494831;
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .deps-popover-section {
            padding: 0.45rem 0.65rem 0.4rem;
        }
        .deps-popover-section + .deps-popover-section {
            border-top: 1px solid #cbc8aa;
        }
        .deps-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #5f5d48;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.3rem;
        }
        .deps-popover ul { list-style: none; padding: 0; margin: 0; }
        .deps-popover li {
            padding: 0;
            margin: 0;
        }
        .deps-popover-link {
            display: block;
            width: 100%;
            padding: 0.12rem 0;
            color: #1d4f6e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.75rem;
            line-height: 1.45;
            text-align: left;
            background: transparent;
            border: 0;
            cursor: pointer;
            font-family: inherit;
        }
        .deps-popover-link:hover,
        .deps-popover-link:focus-visible {
            color: #d44e38;
            outline: none;
            text-decoration: underline;
        }
        .deps-more {
            display: inline-block;
            margin-top: 0.25rem;
            color: #d44e38;
            font-style: italic;
            cursor: pointer;
            font-size: 0.72rem;
        }
        .deps-more:hover { text-decoration: underline; }
        .deps-popover-loading { padding: 0.5rem 0.65rem; color: #5f5d48; font-size: 0.75rem; }
        /* File modal */
        .file-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1500;
        }
        .file-modal-dialog {
            background: #fff;
            border: 1px solid #000;
            box-shadow: 6px 6px 0 #000;
            width: 90vw;
            max-width: 1100px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-modal-header {
            background: #dedac6;
            border-bottom: 1px solid #000;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .file-modal-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 600;
            color: #1d1c0f;
        }
        .file-modal-close {
            background: none;
            border: 1px solid #000;
            width: 1.75rem;
            height: 1.75rem;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1c0f;
            transition: background 0.1s;
        }
        .file-modal-close:hover { background: #fff900; }
        .file-modal-body {
            overflow-y: auto;
            flex: 1;
            padding: 0;
            background: #fff;
        }
        /* File view lines */
        .file-meta {
            padding: 0.35rem 1rem;
            background: #f2eed9;
            border-bottom: 1px solid #cbc8aa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #5f5d48;
        }
        .file-code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
        .file-line {
            display: flex;
            padding: 0 1rem;
            line-height: 1.55;
        }
        .file-line:hover { background: #f8f4df; }
        /* Matched line highlight */
        .file-line-highlight { background: var(--hl-line-bg) !important; }
        .file-line-num {
            color: #5f5d48;
            min-width: 3rem;
            text-align: right;
            padding-right: 1.25rem;
            user-select: none;
            flex-shrink: 0;
        }
        .file-line-content { white-space: pre; flex: 1; }
        /* "Show more" controls at the edges of the rendered window */
        .file-more:empty { display: none; }
        .file-more { padding: 0.35rem 1rem; background: #f2eed9; border-top: 1px solid #cbc8aa; border-bottom: 1px solid #cbc8aa; }
        .file-more-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.3rem 0.75rem;
            background: #fff;
            color: #1d1c0f;
            border: 1px solid #000;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }
        .file-more-btn:hover { background: #fff900; }
        /* Empty / loading / error states */
        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: #5f5d48;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        .loading {
            padding: 2rem;
            text-align: center;
            color: #5f5d48;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #cbc8aa;
            border-top-color: #646100;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-index-state {
            padding: 3rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #5f5d48;
        }
        .loading-progress {
            width: 200px;
            height: 4px;
            background: #e7e3ce;
            border: 1px solid #000;
            margin: 0.75rem auto 0;
            overflow: hidden;
        }
        .loading-progress-bar {
            height: 100%;
            background: #fff900;
            border-right: 1px solid #000;
            transition: width 0.3s;
        }
        .error-message {
            padding: 1rem 1.5rem;
            background: #ffdad6;
            border: 1px solid #ba1a1a;
            color: #93000a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
        }
        /* Progress bar animation */
        .progress-fill {
            height: 100%;
            background: #fff900;
            transition: width 0.3s ease;
        }
        .progress-fill.completed { background: #646100; }
        /* Status badge */
        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border: 1px solid #000;
            background: #fff900;
            color: #000;
            text-transform: uppercase;
        }
        .status-badge.status-idle { background: #ebe77f; }
        .status-badge.status-completed { background: #a9efed; }
        .status-badge.status-loading_index,
        .status-badge.status-indexing,
        .status-badge.status-discovering { background: #fff900; }
        /* Search disabled state */
        #query:disabled { opacity: 0.6; cursor: not-allowed; }
        /* Mode toggle "on" look — set only by syncToggleVisuals() in keyword.js */
        .mode-toggle.toggle-on { background: #fff900; color: #000; }
        /* The checkbox inside is sr-only, so show keyboard focus on the label */
        .mode-toggle:has(input:focus-visible) { outline: 2px solid #646100; outline-offset: -2px; }
        /* Keyboard-selected result group (j/k) */
        .result-group:focus-visible { outline: 3px solid #646100; outline-offset: 2px; }
        /* Tailwind's outline colour (#5f5d48) is 4.2:1 on the #fefae4 ground and
           3.2:1 on the #dedac6 result headers; #5f5d48 is 6.4:1 and 4.75:1. */
        .text-outline { color: #5f5d48; }
        /* Paging */
        .load-more-row { display: flex; justify-content: center; padding: 0.5rem 0 1rem; }
        .load-more-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.6rem 1.5rem;
            background: #fff900;
            color: #000;
            border: 1px solid #000;
            box-shadow: 2px 2px 0 #000;
            cursor: pointer;
        }
        .load-more-btn:hover { background: #000; color: #fff900; }
        .load-more-btn:disabled { opacity: 0.6; cursor: wait; }
        /* Hit whose content was cut at the 500-byte window */
        .truncated-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 2px 6px;
            background: #ffdad6;
            color: #93000a;
            border: 1px solid #ba1a1a;
            cursor: help;
            white-space: nowrap;
        }
        /* Copy-path button feedback (set briefly by setCopyButtonState) */
        .copy-path-btn.copy-ok { color: #1e6868 !important; }
        .copy-path-btn.copy-failed { color: #ba1a1a !important; }
        /* Filter panel */
        #filter-panel { display: none; }
        #filter-panel.open { display: block; }
        /* Advanced options section */
        .advanced-options { display: none; }
        /* Hide results-header visually when JS sets display:none — override Tailwind */
        #results-header[style*="display: none"] { display: none !important; }
        #progress-panel[style*="display: none"] { display: none !important; }

        /* ===== COMPACT NAV SEARCH ===== */
        /* Absolutely positioned inside the sticky header; only transform+opacity
           animated. It is anchored to the RIGHT (just left of the help icon), on
           the track the index stats occupy, and the stats are hidden while it is
           shown. Centred at left:50% it sat on top of FILES:/CONTENT: at 1440px
           (box x 550-890 vs stats x 705-880) and on the nav links below 1024px
           (the links end near x=510; a 340px box centred at 512 starts at 342). */
        #nav-search {
            position: absolute;
            right: 52px; /* 24px header padding + 20px help icon + 8px gap */
            top: 50%;
            /* -10px: slides up from just below centre on enter; resting at -50% (true centre) */
            transform: translateY(calc(-50% - 10px));
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: stretch;
            height: 36px;
            border: 1.5px solid #000;
            background: #fff;
            box-shadow: 3px 3px 0 #000;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            overflow: hidden;
        }
        #nav-search.nav-search-visible {
            transform: translateY(-50%);
            opacity: 1;
            pointer-events: auto;
        }
        /* On narrow viewports the compact search would overlap the wordmark —
           hide it there (the main search box is one scroll away). */
        @media (max-width: 640px) {
            #nav-search { display: none !important; }
        }
        /* 641-1023px: no stats row, but the nav links end near x=510. Keep the
           box short (icon + 120px input; Enter submits, the RUN button is
           dropped) so at 768px its left edge, 768-52-~160 = ~556, clears them. */
        @media (max-width: 1023px) {
            #nav-search-btn { display: none; }
        }
        /* >=1024px: the box (~355px with a 260px input) takes the stats' place;
           at 1024px its left edge is ~617, right of the nav links. */
        @media (min-width: 1024px) {
            header.nav-compact #header-stats { visibility: hidden; }
        }
        #nav-search-icon {
            display: flex;
            align-items: center;
            padding: 0 0.5rem 0 0.6rem;
            color: #5f5d48;
            flex-shrink: 0;
        }
        #nav-query {
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #1d1c0f;
            padding: 0 0.4rem;
            width: 120px;
        }
        @media (min-width: 1024px) { #nav-query { width: 260px; } }
        #nav-query::placeholder { color: #5f5d48; }
        #nav-search-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.65rem;
            background: #fff900;
            color: #000;
            border-left: 1.5px solid #000;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            flex-shrink: 0;
            transition: background 0.1s;
            white-space: nowrap;
        }
        #nav-search-btn:hover { background: #ebe77f; }
        @media (prefers-reduced-motion: reduce) {
            #nav-search { transition: opacity 0.01ms; }
        }
    </style>
</head>

    <!-- ===== TOP NAV ===== -->
    <header class="bg-white text-on-background font-label uppercase tracking-tighter text-sm flex justify-between items-center w-full px-6 h-14 sticky top-0 z-50 border-b border-black">
        <div class="flex items-center gap-6">
            <div class="text-base font-bold font-label text-black bg-primary-container px-2 py-0.5 border border-black">FAST_CODE_SEARCH</div>
            <nav class="hidden md:flex items-center gap-0 h-14">
                <a class="h-full flex items-center px-3 bg-primary-container border-b-2 border-black text-black font-bold transition-colors duration-75" href="/">SEARCH</a>
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/semantic.html">SEMANTIC</a>
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/diagnostics.html">INDEX</a>
                <a class="h-full flex items-center px-3 text-outline hover:bg-primary-container hover:text-black hover:border-b-2 hover:border-black transition-colors duration-75" href="/docs.html">DOCS</a>
            </nav>
        </div>

        <!-- Compact search bar — slides into nav when main search scrolls out of view -->
        <div id="nav-search" role="search" aria-label="Quick search" aria-hidden="true">
            <span id="nav-search-icon"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg></span>
            <input type="text" id="nav-query" placeholder="SEARCH..." autocomplete="off"
                   tabindex="-1" aria-label="Quick search query"/>
            <button id="nav-search-btn" tabindex="-1" title="Execute search">RUN ↵</button>
        </div>
        <!-- Index stats row (hidden while the compact search occupies its track) -->
        <div id="header-stats" class="hidden lg:flex items-center gap-4 text-[10px] font-label text-outline">
            <span title="Total number of source files in the index">FILES: <span id="stat-files" class="text-on-surface font-bold">-</span></span>
            <span title="Total size of all indexed file content">CONTENT: <span id="stat-content" class="text-on-surface font-bold">-</span></span>
            <span title="File content currently mapped into memory by searches (grows as files are read, not the index size)">MAPPED: <span id="stat-size" class="text-on-surface font-bold">-</span></span>
            <span title="Number of unique 3-character sequences">TRIGRAMS: <span id="stat-trigrams" class="text-on-surface font-bold">-</span></span>
            <span title="Number of import/dependency edges used to boost relevance scoring">DEPS: <span id="stat-deps" class="text-on-surface font-bold">-</span></span>
        </div>
        <a href="/docs.html" class="text-outline hover:text-black transition-colors flex items-center" title="Documentation" aria-label="Documentation"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-help-outline"/></svg></a>
    </header>

    <!-- ===== PROGRESS PANEL ===== -->
    <div id="progress-panel" class="bg-surface-container-low border-b border-black px-6 py-2 items-center gap-4 text-xs font-label" style="display: none;">
        <span class="status-badge" id="progress-status">Ready</span>
        <div class="flex-1 h-2 bg-surface-container-highest border border-black overflow-hidden max-w-xs">
            <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
        </div>
        <span class="text-outline" id="progress-percent">0%</span>
        <span class="text-outline italic" id="progress-message"></span>
    </div>

    <!-- Backend status banner (shown when keyword backend is unavailable or wrong server type) -->
    <div id="backend-banner" style="display: none;" class="border-b border-black px-6 py-2 flex items-center gap-3 text-xs font-label">
        <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-warning"/></svg>
        <span id="backend-banner-msg" class="flex-1" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <div class="flex items-center gap-2 flex-shrink-0">
            <span id="keyword-status-badge" class="status-badge">KEYWORD</span>
            <span id="semantic-status-badge" class="status-badge">SEMANTIC</span>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="max-w-[1440px] mx-auto p-6 space-y-6">

        <!-- Search Execution Section -->
        <section id="search-section" class="space-y-3">
            <div class="flex flex-col md:flex-row gap-3">
                <!-- Search input -->
                <div class="flex-grow relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <span class="text-outline flex items-center"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-search"/></svg></span>
                    </div>
                    <label for="query" class="sr-only">Search query</label>
                    <input type="text" id="query" placeholder="SEARCH REPOSITORY..." autocomplete="off" autofocus
                        class="w-full bg-surface-container-lowest border border-black pl-12 pr-24 py-4 font-label text-base focus:outline-none focus:ring-1 focus:ring-primary-container placeholder:text-outline"/>
                    <div class="absolute inset-y-0 right-4 flex items-center gap-2">
                        <span class="bg-surface-container-high px-2 py-0.5 text-[10px] font-label border border-outline-variant hidden sm:inline">CMD+K</span>
                    </div>
                    <!-- Search history dropdown -->
                    <div id="search-history-dropdown" style="display:none" class="absolute top-full left-0 right-0 z-50 bg-white border border-black border-t-0 shadow-md max-h-64 overflow-y-auto"></div>
                </div>
                <!-- Toggle group -->
                <div class="flex gap-0 border border-black overflow-hidden flex-shrink-0">
                    <!-- Mode toggles: the "on" look comes from the .toggle-on class,
                         which keyword.js derives from the checkbox state
                         (syncToggleVisuals), so URL/storage/history changes
                         always look the way they behave. -->
                    <label class="mode-toggle flex items-center gap-1.5 px-3 py-2 cursor-pointer bg-surface-container-low hover:bg-primary-container transition-colors text-xs font-label font-bold border-r border-black" title="Enable regular expression syntax">
                        <input type="checkbox" id="regex-mode" class="sr-only">
                        <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-code"/></svg>
                        <span>REGEX</span>
                    </label>
                    <label class="mode-toggle flex items-center gap-1.5 px-3 py-2 cursor-pointer bg-surface-container-low hover:bg-primary-container transition-colors text-xs font-label font-bold border-r border-black" title="Only match symbol definitions">
                        <input type="checkbox" id="symbols-mode" class="sr-only">
                        <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-function"/></svg>
                        <span>SYMBOLS</span>
                    </label>
                    <label class="mode-toggle flex items-center gap-1.5 px-3 py-2 cursor-pointer bg-surface-container-low hover:bg-primary-container transition-colors text-xs font-label font-bold border-r border-black" title="Find references (call sites, type mentions) of the identifier in the query">
                        <input type="checkbox" id="references-mode" class="sr-only">
                        <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-link"/></svg>
                        <span>REFERENCES</span>
                    </label>
                    <!-- Always-visible FILTER toggle so filters can be set BEFORE the
                         first search (the one in the results bar only appears after a search). -->
                    <button type="button" class="filter-toggle flex items-center gap-1.5 px-3 py-2 cursor-pointer bg-surface-container-low hover:bg-primary-container transition-colors text-xs font-label font-bold" title="Show filter and ranking options">
                        <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-tune"/></svg>
                        <span>FILTER</span>
                    </button>
                </div>
                <!-- Execute button -->
                <button id="search-btn" class="bg-primary-container text-black font-label font-bold px-8 py-4 border border-black hover:bg-black hover:text-primary-container transition-all active:translate-x-[2px] active:translate-y-[2px] flex-shrink-0 whitespace-nowrap">
                    EXECUTE_QUERY
                </button>
            </div>

            <!-- Results meta bar (shown after search) -->
            <div id="results-header" class="flex justify-between items-center border-b border-outline-variant pb-2 px-1" style="display: none;">
                <div class="flex gap-4 items-center flex-wrap" aria-live="polite" aria-atomic="true">
                    <span id="results-count" class="font-label text-xs font-bold bg-black text-white px-2 py-0.5"></span>
                    <span id="search-time" class="font-label text-xs text-outline italic"></span>
                    <span id="ranking-info" class="font-label text-xs text-outline"></span>
                </div>
                <div class="flex gap-3">
                    <button id="filter-toggle-btn" class="filter-toggle flex items-center gap-1 font-label text-xs text-outline hover:text-black transition-colors">
                        <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-tune"/></svg> FILTER
                    </button>
                </div>
            </div>

            <!-- Filter panel (hidden by default) -->
            <div id="filter-panel" class="bg-surface-container-low border border-black p-4 space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <label class="flex flex-col gap-1 text-xs font-label text-outline">
                        MAX RESULTS
                        <select id="max-results" class="bg-white border border-black px-2 py-1.5 font-label text-xs text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container">
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                            <option value="250">250</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                        </select>
                    </label>
                    <label class="flex flex-col gap-1 text-xs font-label text-outline">
                        RANKING
                        <select id="rank-mode" class="bg-white border border-black px-2 py-1.5 font-label text-xs text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container">
                            <option value="auto" selected>Auto</option>
                            <option value="fast">Fast</option>
                            <option value="full">Full</option>
                        </select>
                    </label>
                    <label class="flex flex-col gap-1 text-xs font-label text-outline">
                        CONTEXT LINES
                        <select id="context-lines" class="bg-white border border-black px-2 py-1.5 font-label text-xs text-on-surface focus:outline-none focus:ring-1 focus:ring-primary-container" title="Lines of code shown either side of each match">
                            <option value="0" selected>Match only</option>
                            <option value="1">±1 line</option>
                            <option value="2">±2 lines</option>
                            <option value="3">±3 lines</option>
                            <option value="4">±4 lines</option>
                            <option value="5">±5 lines</option>
                        </select>
                    </label>
                    <label class="flex flex-col gap-1 text-xs font-label text-outline">
                        INCLUDE (GLOB)
                        <input type="text" id="include-filter" placeholder="src/**/*.rs;lib/**" autocomplete="off"
                            class="bg-white border border-black px-2 py-1.5 font-label text-xs focus:outline-none focus:ring-1 focus:ring-primary-container placeholder:text-outline"/>
                    </label>
                    <label class="flex flex-col gap-1 text-xs font-label text-outline">
                        EXCLUDE (GLOB)
                        <input type="text" id="exclude-filter" placeholder="**/test/**;**/vendor/**" autocomplete="off"
                            class="bg-white border border-black px-2 py-1.5 font-label text-xs focus:outline-none focus:ring-1 focus:ring-primary-container placeholder:text-outline"/>
                    </label>
                </div>
                <p class="text-[10px] font-label text-outline">Glob patterns (separated by <code class="bg-surface-container-highest px-1">;</code>) matched against workspace-relative paths. Use <code class="bg-surface-container-highest px-1">**</code> for recursive directories.</p>
            </div>

            <!-- Keep for advanced-options querySelector compat (hidden) -->
            <details class="advanced-options" aria-hidden="true">
                <summary></summary>
            </details>
        </section>

        <!-- Results -->
        <section id="results" class="space-y-4">
            <div class="empty-state">
                <p>Enter a search query to find code</p>
            </div>
        </section>

    </main>

    <!-- ===== MOBILE BOTTOM NAV ===== -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-14 bg-white font-label text-[10px] uppercase border-t border-black">
        <a class="flex flex-col items-center justify-center bg-primary-container text-black px-4 py-1" href="/">
            <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-search"/></svg>
            <span>Search</span>
        </a>
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/semantic.html">
            <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-auto-awesome"/></svg>
            <span>Semantic</span>
        </a>
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/diagnostics.html">
            <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-analytics"/></svg>
            <span>Index</span>
        </a>
        <a class="flex flex-col items-center justify-center text-outline px-4 py-1 hover:bg-primary-container hover:text-black transition-all" href="/docs.html">
            <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#i-description"/></svg>
            <span>Docs</span>
        </a>
    </nav>

    <script src="/highlight.min.js"></script>
    <script src="/common.js"></script>
    <script src="/keyword.js"></script>
    <script>
        // Filter panel toggle — bound to every .filter-toggle (the always-visible
        // one in the toggle group and the one in the results bar).
        document.querySelectorAll('.filter-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.getElementById('filter-panel')?.classList.toggle('open');
            });
        });
        // CMD+K shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('query')?.focus();
            }
        });
        // Execute button triggers search (records history via submitSearch)
        document.getElementById('search-btn')?.addEventListener('click', () => {
            if (typeof submitSearch === 'function') submitSearch();
            else if (typeof performSearch === 'function') performSearch();
        });

        // ===== COMPACT NAV SEARCH =====
        // Shows when the main search section scrolls past the sticky header
        (function () {
            const navSearch = document.getElementById('nav-search');
            const navQuery  = document.getElementById('nav-query');
            const navBtn    = document.getElementById('nav-search-btn');
            const mainQuery = document.getElementById('query');
            const section   = document.getElementById('search-section');
            const header    = navSearch ? navSearch.closest('header') : null;
            if (!navSearch || !navQuery || !mainQuery || !section) return;

            // Cached flag: false when SearchReadinessManager sets section to display:none
            let sectionVisible = getComputedStyle(section).display !== 'none';

            function show() {
                navQuery.value = mainQuery.value;
                navSearch.classList.add('nav-search-visible');
                navSearch.setAttribute('aria-hidden', 'false');
                navQuery.removeAttribute('tabindex');
                navBtn && navBtn.removeAttribute('tabindex');
                // Hides the index stats, whose track the compact box now occupies.
                header && header.classList.add('nav-compact');
            }
            function hide() {
                navSearch.classList.remove('nav-search-visible');
                navSearch.setAttribute('aria-hidden', 'true');
                navQuery.setAttribute('tabindex', '-1');
                navBtn && navBtn.setAttribute('tabindex', '-1');
                header && header.classList.remove('nav-compact');
            }

            // Keep compact input in sync with main input (only when visible to avoid wasted writes)
            mainQuery.addEventListener('input', () => {
                if (sectionVisible) navQuery.value = mainQuery.value;
            });

            // Compact input drives main input + live search
            navQuery.addEventListener('input', () => {
                mainQuery.value = navQuery.value;
                mainQuery.dispatchEvent(new Event('input', { bubbles: true }));
            });
            navQuery.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    mainQuery.value = navQuery.value;
                    if (typeof submitSearch === 'function') submitSearch();
                    else if (typeof performSearch === 'function') performSearch();
                }
            });
            navBtn && navBtn.addEventListener('click', () => {
                mainQuery.value = navQuery.value;
                if (typeof submitSearch === 'function') submitSearch();
                else if (typeof performSearch === 'function') performSearch();
            });

            // Fire when search section crosses the bottom of the sticky header (56 px)
            const observer = new IntersectionObserver(
                (entries) => entries.forEach(e => {
                    // Use cached flag to avoid getComputedStyle on every intersection event
                    if (!e.isIntersecting && sectionVisible) show();
                    else hide();
                }),
                { rootMargin: '-56px 0px 0px 0px', threshold: 0 }
            );
            observer.observe(section);

            // Watch for section display:none toggled by SearchReadinessManager (server offline/online)
            new MutationObserver(() => {
                sectionVisible = getComputedStyle(section).display !== 'none';
                if (!sectionVisible) hide();
            }).observe(section, { attributes: true, attributeFilter: ['style'] });
        })();
    </script>
</body>
