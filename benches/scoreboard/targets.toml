# Targets for examples/scoreboard.rs: each key names a number the
# scoreboard reports and gives its largest allowed value. A run over a
# target fails (the nightly "Scale scoreboard" workflow).
#
# The zero targets hold for every run, at any size. The others (times,
# memory) were set from two full runs on 200,000 generated files on a
# 4 vCPU, 16 GB Linux VM (2026-10-23), at about twice the worse of the two
# (memory: about 30% over), and apply only to runs with `files` below.
# The measurements are on the book's "Scale scoreboard" page; change a
# target only with a new measurement there.

files = 200000

[every]
turned_away = 0
refused = 0
errors = 0
crashes = 0
not_settled = 0
check_problems = 0
stall_captures = 0

# Measured: ready 44.5 / 49.9 s, max 0.93 / 0.94 s, 799 / 808 MB.
[cold-build]
ready_secs = 100
p99_ms = 1500
max_ms = 2500
peak_rss_mb = 1050

# Measured: listening 0.05 s, ready 2.4 / 2.3 s, max 0.94 / 0.83 s.
[warm-restart]
listen_secs = 1
ready_secs = 5
max_ms = 2000
peak_rss_mb = 900

# 40,000 files rewritten at once. Measured: fresh 6.9 / 7.1 s,
# p99 1.08 / 1.24 s, max 1.25 / 1.65 s.
[branch-switch]
fresh_secs = 15
p99_ms = 2500
max_ms = 3500
peak_rss_mb = 1050

# 200 files a second for ten minutes. Measured: fresh 0.9 / 1.1 s,
# p99 0.82 / 0.86 s, max 1.13 / 1.29 s, 1,005 / 883 MB.
[stream]
fresh_secs = 5
p99_ms = 2000
max_ms = 3000
peak_rss_mb = 1300

# Eight searchers and a regex that reads every file, on four CPUs: slow
# searches are expected here. Measured: p99 2.8 / 2.2 s, max 4.0 / 5.8 s.
[slow-mix]
fresh_secs = 10
p99_ms = 5000
max_ms = 12000
peak_rss_mb = 1100

# Saves every 5,000 applied changes. Measured: fresh 2.2 / 4.0 s,
# p99 0.98 / 0.94 s, max 1.30 / 1.17 s, 1,019 / 1,073 MB.
[save-under-load]
fresh_secs = 10
p99_ms = 2000
max_ms = 3000
peak_rss_mb = 1400

# 100,000 files rewritten at once: the event queue fills and the tree is
# rescanned. Measured: fresh 31.8 / 32.7 s, p99 1.9 / 1.3 s,
# max 3.5 / 1.5 s, 1,293 / 1,335 MB.
[overflow]
fresh_secs = 70
p99_ms = 4000
max_ms = 7000
peak_rss_mb = 1750
