# Targets for examples/scoreboard.rs: each key names a number the
# scoreboard reports and gives its largest allowed value. A run over a
# target fails (the nightly "Scale scoreboard" workflow).
#
# The zero targets hold for every run, at any size. The others (times,
# memory) were set from two full runs on 200,000 files of the realistic
# generated tree (generator `real-shaped-1`, examples/support/load_tree.rs)
# on a 4 vCPU, 16 GB Linux VM (2026-10-25), at 1.3x the worse of the two
# (memory: 1.15x), and apply only to runs with `files` below. They are
# today's numbers, not goals: indexing throughput is the bottleneck on this
# tree, and they are tightened as the fixes land (plan items B1, B2, C1).
# The measurements are on the book's "Scale scoreboard" page; change a
# target only with a new measurement there.
#
# The memory targets (`peak_anon_mb`) count the server's own memory: its
# resident anonymous pages (heap, stacks). Since v0.20.0 the loaded index
# reads posting lists from the mapped index file, and those page-cache
# pages show in RSS but belong to the kernel's file cache, which the
# kernel drops under pressure. The run still reports `peak_rss_mb`. The
# values below were measured when all memory was heap, so they bound the
# server's own memory as they did before.

files = 200000

[every]
turned_away = 0
refused = 0
errors = 0
crashes = 0
not_settled = 0
check_problems = 0
stall_captures = 0

# Measured: ready 564 / 618 s, p99 2.30 / 2.48 s, max 3.78 / 4.17 s,
# 1,185 / 1,177 MB.
[cold-build]
ready_secs = 800
p99_ms = 3200
max_ms = 5400
peak_anon_mb = 1360

# Measured: listening 0.05 / 0.05 s, ready 4.3 / 4.6 s, p99 1.95 / 1.78 s,
# max 2.40 / 2.16 s, 1,268 / 1,267 MB.
[warm-restart]
listen_secs = 1
ready_secs = 6
p99_ms = 2500
max_ms = 3100
peak_anon_mb = 1460

# 40,000 files rewritten at once. Measured: fresh 149 / 169 s,
# p99 4.19 / 4.46 s, max 5.72 / 4.60 s, 1,268 / 1,268 MB.
[branch-switch]
fresh_secs = 220
p99_ms = 5800
max_ms = 7400
peak_anon_mb = 1460

# 200 files a second for ten minutes. Measured: fresh 26.9 / 30.7 s,
# p99 4.38 / 4.43 s, max 5.26 / 4.87 s, 1,494 / 1,556 MB.
[stream]
fresh_secs = 40
p99_ms = 5800
max_ms = 6800
peak_anon_mb = 1790

# Eight searchers and a regex that reads every file, on four CPUs: slow
# searches are expected here. Measured: fresh 21.2 / 14.5 s,
# p99 11.5 / 8.7 s, max 15.2 / 13.2 s, 1,455 / 1,454 MB.
[slow-mix]
fresh_secs = 28
p99_ms = 14900
max_ms = 19800
peak_anon_mb = 1670

# Saves every 5,000 applied changes. Measured: fresh 157 / 163 s,
# p99 4.50 / 4.38 s, max 5.97 / 5.44 s, 1,986 / 2,037 MB.
[save-under-load]
fresh_secs = 210
p99_ms = 5900
max_ms = 7800
peak_anon_mb = 2340

# 100,000 files rewritten at once: the event queue fills and the tree is
# rescanned. Measured: fresh 530 / 496 s, p99 4.77 / 4.65 s,
# max 5.91 / 6.54 s, 2,818 / 2,582 MB. Both runs also wrote a `backlog`
# capture (changes pending over 300 s without draining), which the zero
# `stall_captures` target fails: the watcher applies about 200 files a
# second here, too slow for this change. Tracked as a bug, not excused.
[overflow]
fresh_secs = 690
p99_ms = 6200
max_ms = 8500
peak_anon_mb = 3240
